# Affordra CI — lint + test on every push to main
name: Affordra CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r code/requirements.txt

      - name: Lint with flake8
        run: |
          # Fail on syntax errors or undefined names only
          flake8 code/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (does not fail the build)
          flake8 code/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
